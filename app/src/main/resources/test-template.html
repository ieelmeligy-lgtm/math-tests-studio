<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Math Tests Studio">
<title>{{PAGE_TITLE}}</title>
<style>
  :root{
    --green:#1f9d57; --green-dark:#157a42; --green-soft:#e8f6ee;
    --ink:#1d2b24; --muted:#5f6f67; --line:#d5e3db; --bg:#f4f8f5; --card:#ffffff;
    --red:#c8372d; --red-soft:#fdeceb; --amber:#f2b632;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  html[lang=ar] body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Roboto,Arial,sans-serif}
  header{background:var(--green);color:#fff;padding:22px 16px 26px}
  header .wrap{max-width:760px;margin:0 auto}
  header h1{margin:0 0 4px;font-size:1.5rem}
  header p{margin:0;opacity:.92;font-size:.95rem}
  main{max-width:760px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .sec{font-size:1.05rem;color:var(--green-dark);margin:20px 4px 10px}
  .progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
  .bar{height:8px;background:#dde9e2;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
  .progress small{color:var(--muted);display:block;margin-top:4px}
  .q-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
  .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green-dark);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
  .stem{font-size:1.1rem;padding-top:2px;min-width:0}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:1.05rem;min-height:52px;background:#fff}
  .opt:hover{border-color:var(--green)}
  .opt .let{flex:none;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line);font-size:.85rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .why{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:#f6f9f7;border-inline-start:4px solid var(--green);font-size:.95rem}
  .why.bad{border-inline-start-color:var(--red)}
  .card.missing{border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,182,50,.25)}
  /* maths markup */
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;font-size:.9em;margin:0 2px}
  .frac b{font-weight:500;padding:0 4px}
  .frac b:first-child{border-bottom:1.5px solid currentColor}
  .rep,.ov{text-decoration:overline}
  .nw,.rt{white-space:nowrap}
  .m{white-space:nowrap;display:inline-block;font-family:"Segoe UI",Roboto,Arial,sans-serif}
  .opt .m{white-space:normal}
  .mb{display:block;margin:6px 0 2px;text-align:left}
  .mb .m{white-space:normal}
  .seq{line-height:2}
  .rad{display:inline-block;border-top:1.5px solid currentColor;padding:1px 1px 0;margin-left:1px;line-height:1.15}
  .rad>.frac{padding-top:3px}
  .ri{font-size:.6em;margin-right:-.45em;vertical-align:.95em}
  .circle{display:inline-block;width:26px;height:26px;border:1.5px solid #9bb3a6;border-radius:50%;vertical-align:middle;margin:0 8px}
  .blank{display:inline-block;width:56px;border-bottom:1.5px solid #9bb3a6;vertical-align:baseline;margin:0 4px}
  .venn{display:inline-flex;align-items:center;vertical-align:middle;margin-inline-start:10px;font-size:.9rem}
  .venn span{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);border-radius:50%;height:44px;line-height:1.1;text-align:center}
  .venn .vl{width:58px;justify-content:flex-start;padding-left:12px;border-right:0;border-radius:50% 0 0 50%}
  .venn .vm{width:34px;border-radius:50%;margin:0 -2px}
  .venn .vr{width:58px;justify-content:flex-end;padding-right:12px;border-left:0;border-radius:0 50% 50% 0}
  .venn-svg{display:block;margin:8px 0 0}
  .venn-svg svg{max-width:100%;height:auto}
  .venn-svg ellipse{fill:none;stroke:var(--ink);stroke-width:1.5}
  .venn-svg circle{fill:currentColor}
  .venn-svg text{font-size:15px;text-anchor:middle;fill:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif}
  .venn-svg text.lab{font-weight:700;fill:#1f5fa8}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 20px;cursor:pointer}
  button[disabled]{opacity:.65;cursor:default}
  .primary{background:var(--green);color:#fff;width:100%;font-size:1.05rem}
  .primary:hover{background:var(--green-dark)}
  .ghost{background:#fff;color:var(--green-dark);border:1.5px solid var(--green)}
  .msg{color:var(--red);font-weight:600;margin:0 0 10px;display:none}
  #result{display:none;text-align:center}
  #result .score{font-size:2.6rem;font-weight:800;color:var(--green-dark);margin:4px 0;direction:ltr;unicode-bidi:isolate}
  #result .who{font-weight:600;font-size:1.1rem}
  #result .note{color:var(--muted);margin:4px 0 14px}
  .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  a.primary,a.ghost{display:inline-block;text-decoration:none;border-radius:10px;padding:13px 20px;font-weight:600;text-align:center}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:8px 16px 28px}
  @media (max-width:420px){.opts{grid-template-columns:1fr}}
  @media print{.progress,.actions,#submitCard{display:none}body{background:#fff}.card{break-inside:avoid}}
  .ch{display:block;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
  .ch input:checked + .opt{border-color:var(--green);background:var(--green-soft)}
  .ch input:checked + .opt .let{background:var(--green);border-color:var(--green);color:#fff}
  .ch input:focus + .opt{box-shadow:0 0 0 3px rgba(31,157,87,.25)}
  /* after the server grades: data-c marks the correct option */
  .graded .ch{pointer-events:none;cursor:default}
  .graded .ch input[data-c] + .opt{border-color:var(--green);background:var(--green-soft)}
  .graded .ch input[data-c] + .opt .let{background:var(--green);border-color:var(--green);color:#fff}
  .graded .ch input:checked:not([data-c]) + .opt{border-color:var(--red);background:var(--red-soft)}
  .graded .ch input:checked:not([data-c]) + .opt .let{background:var(--red);border-color:var(--red);color:#fff}
  .graded .why{display:block}
  html:not(.js) .jsonly{display:none!important}
  .js .nojs{display:none!important}
  .notice{background:#fff8e6;border-color:#f2d58a;font-size:.95rem}
  .who-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.95rem;margin-bottom:12px}
  .who-bar a{color:var(--green-dark);font-weight:600}
  #saveMsg{font-weight:600;color:var(--green-dark);margin:0 0 12px}
</style>
<script>document.documentElement.className='js';</script>
<script src="../config.js"></script>
<script src="../portal.js"></script>
<script>var PORTAL_SESSION=Portal.requireLogin('{{GRADE}}');</script>
</head>
<body>
<header>
  <div class="wrap">
    <h1>{{HEADER_TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>
</header>

<main>
  <div class="who-bar jsonly"><span id="whoami"></span><a href="../index.html">{{T_MY_TESTS}}</a></div>
  <div class="card notice nojs">{{T_NOTICE}}</div>

  <div class="card" id="result" aria-live="polite">
    <div class="who" id="who"></div>
    <div class="score" id="score"></div>
    <div class="note" id="note"></div>
    <p id="saveMsg"></p>
    <div class="actions">
      <button class="ghost" onclick="window.print()">{{T_PRINT}}</button>
      <button class="ghost" onclick="restart()">{{T_AGAIN}}</button>
      <a class="ghost" href="../index.html">{{T_MY_TESTS}}</a>
    </div>
  </div>

  <div class="progress jsonly" id="progress">
    <div class="bar"><i id="barFill"></i></div>
    <small id="barText">{{T_ANSWERED_0}}</small>
  </div>

  <div id="quiz">
{{QUESTIONS}}
  </div>

  <div class="card jsonly" id="submitCard">
    <p class="msg" id="msg"></p>
    <button class="primary" id="submitBtn" onclick="submitTest()">{{T_SUBMIT}}</button>
  </div>
</main>
<footer>{{T_FOOTER}}</footer>

<script>
var TEST_TITLE='{{TEST_TITLE_JS}}';
var TEST_ID='{{TEST_ID}}';
var T={{T_JSON}};

var L=T.letters, attempt=1, busy=false;
var quiz=document.getElementById('quiz');
var cards=quiz.querySelectorAll('.card'), N=cards.length;

function fill(s,v){return s.replace(/\{(\w+)\}/g,function(m,k){return v[k];});}
function inputsOf(i){return cards[i].querySelectorAll('input');}
function pickedOf(i){var a=inputsOf(i),k;for(k=0;k<a.length;k++){if(a[k].checked)return k;}return -1;}

function updateBar(){
  var c=0,i;
  for(i=0;i<N;i++){if(pickedOf(i)>=0){c++;cards[i].classList.remove('missing');}}
  document.getElementById('barFill').style.width=(c/N*100)+'%';
  document.getElementById('barText').textContent=fill(T.answered,{n:c,N:N});
}
quiz.addEventListener('change',updateBar);

function showMsg(t){var m=document.getElementById('msg');m.textContent=t;m.style.display=t?'block':'none';}

function submitTest(){
  if(busy)return;
  if(!PORTAL_SESSION){location.replace('../index.html');return;}
  var first=-1,left=0,i,picks=[];
  for(i=0;i<N;i++){
    var p=pickedOf(i), miss=p<0;
    cards[i].classList.toggle('missing',miss);
    if(miss){left++;if(first<0)first=i;}
    picks.push(p);
  }
  if(left){showMsg(fill(left>1?T.leftN:T.left1,{n:left}));cards[first].scrollIntoView();return;}
  showMsg('');
  busy=true;
  var btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent=T.checking;
  Portal.submitTest({testId:TEST_ID,picks:picks,attempt:attempt},function(r){
    busy=false; btn.disabled=false; btn.textContent=T.submit;
    if(!r||!r.ok){
      showMsg(r&&r.error==='signed_out'?T.expired:T.failed);
      return;
    }
    showResult(r);
  });
}

function showResult(r){
  for(var i=0;i<N;i++){
    var a=inputsOf(i), c=r.correct[i], ok=pickedOf(i)===c, k;
    for(k=0;k<a.length;k++){if(k===c)a[k].setAttribute('data-c','');else a[k].removeAttribute('data-c');}
    var w=cards[i].querySelector('.why');
    w.classList.toggle('bad',!ok);
    w.innerHTML='<strong>'+(ok?T.correct:fill(T.correctAnswer,{L:L[c]}))+'</strong>'+(r.explanations[i]||'');
  }
  quiz.classList.add('graded');
  var pct=r.percent;
  document.getElementById('who').textContent=PORTAL_SESSION.name;
  document.getElementById('score').textContent=r.score+' / '+r.total+'  ('+pct+'%)';
  document.getElementById('note').textContent=pct===100?T.note100:pct>=80?T.note80:pct>=50?T.note50:T.note0;
  document.getElementById('saveMsg').textContent=r.saved?T.saved:'';
  document.getElementById('result').style.display='block';
  document.getElementById('submitCard').style.display='none';
  document.getElementById('progress').style.display='none';
  window.scrollTo(0,0);
}
function restart(){
  var all=quiz.querySelectorAll('input'), k;
  for(k=0;k<all.length;k++){all[k].checked=false;all[k].removeAttribute('data-c');}
  var ws=quiz.querySelectorAll('.why'); for(k=0;k<ws.length;k++){ws[k].innerHTML='';ws[k].classList.remove('bad');}
  attempt++;
  quiz.classList.remove('graded');
  updateBar();
  document.getElementById('result').style.display='none';
  document.getElementById('submitCard').style.display='block';
  document.getElementById('progress').style.display='block';
  window.scrollTo(0,0);
}
updateBar();
if(PORTAL_SESSION){document.getElementById('whoami').textContent=fill(T.signedIn,{name:PORTAL_SESSION.name});}
</script>
</body>
</html>
